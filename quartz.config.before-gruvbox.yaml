# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: John Craig Castillo
  pageTitleSuffix: " | IT & Security Portfolio"

  enableSPA: true
  enablePopovers: true

  analytics:
    provider: plausible

  locale: en-US
  baseUrl: johncraigcastillo.github.io/portfolio

  ignorePatterns:
    - private
    - templates
    - .obsidian

  theme:
    fontOrigin: googleFonts
    cdnCaching: true

    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono

    colors:
      lightMode:
        light: "#f8fafc"
        lightgray: "#e2e8f0"
        gray: "#94a3b8"
        darkgray: "#475569"
        dark: "#0f172a"
        secondary: "#2563eb"
        tertiary: "#0f766e"
        highlight: rgba(37, 99, 235, 0.10)
        textHighlight: "#fde68a"

      darkMode:
        light: "#0f1117"
        lightgray: "#252a34"
        gray: "#64748b"
        darkgray: "#cbd5e1"
        dark: "#f1f5f9"
        secondary: "#60a5fa"
        tertiary: "#5eead4"
        highlight: rgba(96, 165, 250, 0.12)
        textHighlight: "#854d0e"

plugins:

  # ---------------------------------------------------------------------------
  # CONTENT PROCESSING
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/citations"
    enabled: false
    order: 85

  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91

  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  # ---------------------------------------------------------------------------
  # THEME / CORE
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/quartz-fonts"
    enabled: true

  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both

  # ---------------------------------------------------------------------------
  # PUBLISHING
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/explicit-publish"
    enabled: false

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false

  # ---------------------------------------------------------------------------
  # PAGE GENERATION
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: true

  - source: "@quartz-community/cname"
    enabled: false

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  # ---------------------------------------------------------------------------
  # NAVIGATION
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  # ---------------------------------------------------------------------------
  # PAGE CONTENT
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index

  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
      
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 1.1
        repelForce: 0.25
        centerForce: 0.45
        linkDistance: 18
        fontSize: 1.15
        opacityScale: 1
        showTags: true
        removeTags:
          - skills-map
        focusOnHover: true
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        showTags: true
    layout:
      position: afterBody
      priority: 10
      condition: skills-map

  # ---------------------------------------------------------------------------
  # FOOTER
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/johncraigcastillo
    layout:
      position: footer
      priority: 50

  # ---------------------------------------------------------------------------
  # MOBILE SPACING
  # ---------------------------------------------------------------------------

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem

  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []

    content: {}

    folder:
      positions:
        right: []

    tag:
      positions:
        right: []
